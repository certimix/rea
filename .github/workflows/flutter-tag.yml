name: Flutter Tag Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.5.8)'
        required: false
        default: 'v1.5.8'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag || github.ref_name }}
